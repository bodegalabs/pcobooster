pre-commit:
  jobs:
    - run: bun run fix --max-warnings 0 --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,yml,yaml}"
      # Xcode, Icon Composer, and parity fixtures write these; oxfmt ignores them too.
      exclude:
        - "apps/ios/**/*.xcassets/**"
        - "apps/ios/**/*.icon/**"
        - "apps/ios/**/Fixtures/**"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: check
      run: bun run check
    - name: typecheck
      run: bun run typecheck
