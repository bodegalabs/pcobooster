appId: com.pcobooster.ios
---
# Songs previews against fixtures: Planning Center's chart PDF, then an arrangement's files: a
# key's PDF (bundled fixture bytes), audio in the system player, and a file Planning Center
# won't release. Fixture audio and video links do not resolve, so the player shows its failure.
- tapOn: "Songs"
- tapOn: "Search songs, writers, or themes"
- inputText: "morning light"
- tapOn:
    id: "song-row-5501"
- tapOn:
    id: "song-view-chart-pdf"
- assertVisible:
    id: "chart-pdf"
- takeScreenshot: songs-chart-pdf
- openLink: "pcobooster://songs/5501/files?arrangement=55011"
- assertVisible:
    id: "song-file-88005"
- assertVisible:
    id: "song-file-88001"
- takeScreenshot: songs-files
- tapOn:
    id: "song-file-88005"
- assertVisible:
    id: "song-file-document"
- takeScreenshot: songs-file-pdf
- openLink: "pcobooster://songs/5501/files/88001?arrangement=55011"
- assertVisible: "Demo recording"
- takeScreenshot: songs-file-audio
- openLink: "pcobooster://songs/5501/files/88007?arrangement=55011&key=550111"
- assertVisible: "Planning Center doesn’t allow downloading this file. Open it in Planning Center."
