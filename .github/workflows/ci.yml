name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # Build-time placeholders: CI compiles routes without connecting to services.
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/worshipadmin_test
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: worshipadmin-ci-build-secret-with-no-production-access
          PLANNING_CENTER_OAUTH_CLIENT_ID: test-client
          PLANNING_CENTER_OAUTH_CLIENT_SECRET: test-client-secret
