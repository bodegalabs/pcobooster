name: CI

on:
  pull_request:
    # `labeled` lets adding the `preview` label request a deploy for the current head.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Request a production deployment after checks pass
        type: boolean
        default: false

permissions:
  contents: read

# Concurrency is per job: a new pull request push cancels that PR's older checks, but
# deployment jobs never interrupt an Alchemy state update.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Lint workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Lint
        run: bunx turbo run //#lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-build-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Validates admin's Vite build with the preview stages' base path.
      ADMIN_BASE_PATH: /admin
      # Builds the product with the preview environment's setting.
      PEOPLE_PAGE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Build Cloudflare bundles without credentials
        run: bun run build:cloudflare

  preview:
    needs: [ci, cloudflare-build]
    # Previews deploy only on request: add the `preview` label, then approve the deployment.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: cloudflare-preview
      url: https://pcobooster-pr-${{ github.event.pull_request.number }}-web.jakebodea.workers.dev
    concurrency:
      group: cloudflare-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
      PREVIEW_ORIGIN: https://pcobooster-pr-${{ github.event.pull_request.number }}-web.jakebodea.workers.dev
      ADMIN_BASE_PATH: /admin
    steps:
      - name: Checkout verified merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Reject closed or superseded preview revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | join(":")')
          test "$current" = "open:$EXPECTED_HEAD"
      - name: Read preview-only secrets
        uses: ./.github/actions/infisical
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
      # The protected GitHub environment requires Jake's approval for each run.
      - name: Deploy approved preview
        run: bun alchemy deploy --stage "$PREVIEW_STAGE" --no-input --yes
      - name: Verify preview serves this commit
        run: bun scripts/cloudflare/verify-deployment.ts "$PREVIEW_ORIGIN" "$GITHUB_SHA"

  production:
    needs: [ci, cloudflare-build]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: cloudflare-production
      url: https://pcobooster.com
    concurrency:
      group: cloudflare-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_CUSTOM_DOMAINS: ${{ vars.CLOUDFLARE_CUSTOM_DOMAINS }}
    steps:
      - name: Checkout verified production commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Reject superseded production revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - name: Read production-only secrets
        uses: ./.github/actions/infisical
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
      - name: Deploy production revision
        run: bun alchemy deploy --stage prod --no-input --yes
      - name: Verify production serves this commit
        run: bun scripts/cloudflare/verify-deployment.ts https://pcobooster.com "$GITHUB_SHA"
      # Warns and skips when POSTHOG_ANNOTATION_API_KEY is absent; never fails the deploy.
      - name: Mark the deploy on PostHog charts
        run: bun scripts/posthog/annotate-deploy.ts "$GITHUB_SHA"
