name: Cloudflare drift

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Compares production's live Cloudflare resources with Alchemy's state and fails when any were
# changed outside a deploy (for example a Flagship flag or DNS record edited in the dashboard),
# before the next deploy silently overwrites them. It only reads; see scripts/cloudflare/check-drift.ts.

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: cloudflare-production
    concurrency:
      # Shares the deploy's group, so a check never observes a half-applied deploy.
      group: cloudflare-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_CUSTOM_DOMAINS: ${{ vars.CLOUDFLARE_CUSTOM_DOMAINS }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Read production credentials
        uses: ./.github/actions/infisical
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
      - name: Check production for drift
        run: bun scripts/cloudflare/check-drift.ts prod
