name: Cloudflare preview cleanup

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Both jobs run only trusted `main` code with `alchemy.cleanup.ts`, which reads no app secrets
# and builds nothing. The `cloudflare-preview-cleanup` environment is limited to `main` and
# needs no approval, so teardown never waits on a person.

jobs:
  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: cloudflare-preview-cleanup
    concurrency:
      group: cloudflare-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      # pull_request_target is used only for cleanup from trusted main, never PR code.
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Refuse cleanup of a reopened pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          test "$current" = closed
      - name: Read preview Cloudflare credentials
        uses: ./.github/actions/infisical
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
      - name: Remove closed pull request resources
        run: bun alchemy destroy alchemy.cleanup.ts --stage "$PREVIEW_STAGE" --no-input --yes

  sweep:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    environment: cloudflare-preview-cleanup
    concurrency:
      group: cloudflare-preview-sweep
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Read preview Cloudflare credentials
        uses: ./.github/actions/infisical
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
      - name: Destroy stages whose pull request is closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/cloudflare/sweep-previews.ts
