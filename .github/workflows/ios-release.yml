name: iOS release

on:
  workflow_dispatch:
    inputs:
      request_upload:
        description: Run the protected release job (blocked until enablement is approved)
        type: boolean
        default: false

permissions:
  contents: read

# This app-wide group must cover preparation AND the eventual single upload attempt.
# Never use a revision/run-specific group or cancel a release during an ambiguous upload.
concurrency:
  group: ios-release-com.pcobooster.ios
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup toolchain
        uses: ./.github/actions/setup
      - name: Check release boundaries
        run: bun vitest run scripts/mobile-release.test.ts scripts/mobile-hermes-gate.test.ts scripts/release-ios.test.ts scripts/mobile-release-artifacts.test.ts scripts/mobile-ci-release.test.ts scripts/mobile-ci-ledger.test.ts scripts/mobile-signed-export.test.ts
      - name: Check matching Release Hermes runtime
        run: bun run --cwd apps/mobile ios:hermes-gate

  # The sole executor: claim, archive, sign, verify, and upload one build, then report
  # processing. apps/mobile/scripts/release/ci-cli.ts orders the steps and records each one
  # in the ios-release-ledger branch; see docs/ci-cd.md.
  release:
    if: github.ref == 'refs/heads/main' && inputs.request_upload
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 150
    # A new environment, unprovisioned until approved. Do not reuse `testflight`, whose
    # existing environment has broad production credentials and has no reviewer gate.
    environment: ios-release-upload
    # Enablement grants, in its reviewed change only: isolated release credentials,
    # and a ledger writer limited to the ios-release-ledger branch.
    permissions:
      contents: read
    steps:
      # Must stay the first step until the reviewed enablement change. Nothing below runs:
      # no checkout, credential read, ledger write, signing, or upload.
      - name: Enablement gate
        run: |
          echo 'BLOCKED: no uploader or signing credential retrieval is enabled.' >&2
          echo 'Approve and prove the isolated release credentials, protected environment, ledger branch, signing export, artifact and symbol gates described in docs/ci-cd.md before enabling this stage.' >&2
          exit 1

      - name: Checkout dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse reruns and other revisions
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "Attempt $GITHUB_RUN_ATTEMPT: a rerun never claims or uploads. Reconcile, then dispatch a new run." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Select pinned Xcode and Java
        env:
          RELEASE_DEVELOPER_DIR: ${{ vars.IOS_RELEASE_DEVELOPER_DIR }}
        run: |
          test -d "$RELEASE_DEVELOPER_DIR" || { echo 'IOS_RELEASE_DEVELOPER_DIR must name the approved Xcode.' >&2; exit 1; }
          echo "DEVELOPER_DIR=$RELEASE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: CI gate
        run: bun run ci

      - name: Install pinned release tools
        env:
          MAESTRO_URL: ${{ vars.IOS_RELEASE_MAESTRO_URL }}
          MAESTRO_SHA256: ${{ vars.IOS_RELEASE_MAESTRO_SHA256 }}
          POSTHOG_CLI_URL: ${{ vars.IOS_RELEASE_POSTHOG_CLI_URL }}
          POSTHOG_CLI_SHA256: ${{ vars.IOS_RELEASE_POSTHOG_CLI_SHA256 }}
        run: |
          for name in MAESTRO_URL MAESTRO_SHA256 POSTHOG_CLI_URL POSTHOG_CLI_SHA256; do
            test -n "${!name}" || { echo "$name must be set to an approved, checksummed release." >&2; exit 1; }
          done
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "$MAESTRO_URL"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check --quiet
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "MAESTRO_BIN=$RUNNER_TEMP/maestro/maestro/bin/maestro" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/posthog-cli.tar.xz" "$POSTHOG_CLI_URL"
          echo "$POSTHOG_CLI_SHA256  $RUNNER_TEMP/posthog-cli.tar.xz" | shasum -a 256 --check --quiet
          mkdir "$RUNNER_TEMP/posthog-cli"
          tar -xJf "$RUNNER_TEMP/posthog-cli.tar.xz" -C "$RUNNER_TEMP/posthog-cli" --strip-components 1
          echo "POSTHOG_CLI=$RUNNER_TEMP/posthog-cli/posthog-cli" >> "$GITHUB_ENV"

      - name: Release simulator smoke at this revision
        run: |
          xcrun simctl create pcob-release-smoke "iPhone 17 Pro"
          bun run --cwd apps/mobile ios:release-smoke --build

      # Only App Store Connect read/signing keys and the symbol-upload key, from the isolated
      # release environment, explicitly injected by its separate enablement change.

      - name: Release one build
        id: release
        env:
          PCOB_RELEASE_LEDGER_TOKEN: ${{ github.token }}
        run: bun run --cwd apps/mobile scripts/release/ci-cli.ts release

      - name: Report App Store Connect processing
        env:
          PCOB_RELEASE_LEDGER_TOKEN: ${{ github.token }}
        run: bun run --cwd apps/mobile scripts/release/ci-cli.ts availability --timeout-minutes 30

      # Retained for review and symbolication. The ledger branch, not this artifact, records
      # which numbers are used.
      - name: Retain release artifacts
        if: ${{ !cancelled() && steps.release.conclusion != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            apps/mobile/build/release/release-manifest.json
            apps/mobile/build/release/artifact.json
            apps/mobile/build/release/export/*.ipa
            apps/mobile/build/release/maps
            apps/mobile/build/release/PCOBooster.xcarchive/dSYMs
            apps/mobile/build/release/upload-output.txt
            apps/mobile/build/release/availability.json
            apps/mobile/build/hermes-gate/runs
            apps/mobile/.captures/release-smoke
